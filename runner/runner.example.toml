# Inrface build runner settings. You don't need to write this by hand: run `inrface_runner.py setup` in your checkout.
# It saves this file as ~/.config/inrface-runner/config.toml. Inrface never sets anything in it.

repo = "owner/name"                         # found by setup from the checkout's origin
work_dir = "/home/you/code/app"             # the checkout
base_branch = "main"
github_token_file = "~/.config/inrface-runner/github-token"   # the same token Inrface uses: Contents, Issues and Pull requests, Read and write

# Optional, with their defaults:
# allowed_authors = ["login"]   # who opens the build issues; default: the token's owner
# test_commands = ["npm test"]  # default: found from the repo
# max_builds = 1
# interval_minutes = 5
# max_runs_per_day = 20
# timeout_minutes = 60
# max_conflict_fixes = 2        # rebase a pull request that can't merge; 0 turns it off
# build_label = "ready-to-build"
# verify_commands = ["/path/to/check.sh"]   # a script that starts the app and looks at it
# command = ["claude", "-p", "{prompt}"]    # a different agent; never run through a shell

# Optional: let Inrface switch it on and off (Settings -> Connectors -> Build runner).
# inrface_url = "https://app.example.com"
# runner_key = "inrr_..."
# inrface_headers = { "CF-Access-Client-Id" = "...", "CF-Access-Client-Secret" = "..." }   # if Cloudflare Access is in front
